name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI (Web App & Workspace)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter=@unifyvault/web-v2 lint

      - name: Run TypeScript Typecheck
        run: pnpm --filter=@unifyvault/web-v2 typecheck

      - name: Run Build
        run: pnpm --filter=@unifyvault/web-v2 build

      - name: Run Unit & Integration Tests
        run: pnpm --filter=@unifyvault/web-v2 test

      - name: Upload Frontend Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: apps/web-v2/coverage/
          retention-days: 14

  protocol:
    name: Protocol CI (Solidity & Foundry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Cache Foundry Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            packages/protocol/cache
            packages/protocol/out
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/protocol/src/**/*.sol', 'packages/protocol/test/**/*.sol', 'packages/protocol/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Check Solidity Formatting
        run: |
          cd packages/protocol
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE_REF" --depth=1 || true
          CHANGED_SOL=$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'src/**/*.sol' 'test/**/*.sol' 'script/**/*.sol' || true)
          if [ -n "$CHANGED_SOL" ]; then
            echo "Checking formatting for changed Solidity files:"
            echo "$CHANGED_SOL"
            forge fmt --check $CHANGED_SOL
          else
            echo "No Solidity files modified in this branch/PR. Skipping baseline format check."
          fi

      - name: Build Smart Contracts
        run: cd packages/protocol && forge build src

      - name: Run Foundry Test Suite
        run: cd packages/protocol && pnpm test:all

      - name: Run Forge Gas Snapshot
        run: cd packages/protocol && forge snapshot --no-match-path "test/{fork/*,ExecuteStake50Flow.t.sol}"

      - name: Generate Coverage Report
        run: cd packages/protocol && forge coverage --no-match-path "test/{fork/*,ExecuteStake50Flow.t.sol}" || true

      - name: Upload Protocol Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-coverage-report
          path: |
            packages/protocol/lcov.info
            packages/protocol/.gas-snapshot
          retention-days: 14
