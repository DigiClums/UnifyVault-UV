name: Android Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name override (e.g. 1.0.1 - defaults to tag name without v)'
        required: false
        default: ''
      version_code:
        description: 'Version Code override (e.g. 10001 - calculated from semver if blank)'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub Release asset (true/false)'
        type: boolean
        required: false
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Determine Version Name & Code
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            CLEAN_VERSION="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          else
            CLEAN_VERSION="1.0.0"
          fi

          echo "Determined versionName: $CLEAN_VERSION"

          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=$(echo "${PATCH:-0}" | grep -oE '^[0-9]+' || echo "0")
            V_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          fi

          if [ "$V_CODE" -le 0 ]; then
            V_CODE=1
          fi

          echo "Determined versionCode: $V_CODE"
          echo "version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App Static Export
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_APP_VERSION: ${{ steps.versioning.outputs.version_name }}
        run: |
          pnpm --filter=@unifyvault/web-v2 build

      - name: Sync Capacitor Android Project
        run: |
          cd apps/web-v2
          npx cap sync android

      - name: Setup Production Keystore Securely
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set!"
            exit 1
          fi
          KEYSTORE_DIR=$(mktemp -d -t keystore-XXXXXX)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/unifyvault-release-key.jks"
          chmod 600 "$KEYSTORE_DIR/unifyvault-release-key.jks"
          echo "KEYSTORE_FILE=$KEYSTORE_DIR/unifyvault-release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_DIR=$KEYSTORE_DIR" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: |
          cd apps/web-v2/android
          chmod +x ./gradlew
          ./gradlew assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"

      - name: Verify APK Signature & Package Details
        run: |
          APK_PATH="apps/web-v2/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Built APK not found at $APK_PATH"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner || true)
          fi
          if [ ! -x "$AAPT2" ]; then
            AAPT2=$(which aapt2 || true)
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Using aapt2: $AAPT2"

          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "Checking APK metadata using aapt2..."
          DUMP_OUTPUT=$("$AAPT2" dump badging "$APK_PATH" || true)
          echo "$DUMP_OUTPUT" | grep -E "package: name=" || true

          PKG_NAME=$(echo "$DUMP_OUTPUT" | grep -o "package: name='[^']*'" | cut -d"'" -f2)
          if [ "$PKG_NAME" != "xyz.unifyvault.app" ]; then
            echo "::error::Package ID mismatch! Expected 'xyz.unifyvault.app', got '$PKG_NAME'"
            exit 1
          fi
          echo "✓ Package verified: $PKG_NAME"

      - name: Securely Remove Temporary Keystore
        if: always()
        run: |
          if [ -n "$KEYSTORE_DIR" ] && [ -d "$KEYSTORE_DIR" ]; then
            rm -rf "$KEYSTORE_DIR"
            echo "Secure temporary keystore directory removed."
          fi

      - name: Generate SHA256 Checksum
        run: |
          cd apps/web-v2/android
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          CANONICAL_APK="UnifyVault-v${V_NAME}.apk"
          LATEST_APK="UnifyVault-latest.apk"
          cp app/build/outputs/apk/release/app-release.apk "$CANONICAL_APK"
          cp app/build/outputs/apk/release/app-release.apk "$LATEST_APK"
          sha256sum "$CANONICAL_APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unifyvault-android-release-${{ steps.versioning.outputs.version_name }}
          path: |
            apps/web-v2/android/UnifyVault-v*.apk
            apps/web-v2/android/UnifyVault-latest.apk
            apps/web-v2/android/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V_NAME: ${{ steps.versioning.outputs.version_name }}
          V_CODE: ${{ steps.versioning.outputs.version_code }}
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${V_NAME}"
          fi

          CANONICAL_APK="apps/web-v2/android/UnifyVault-v${V_NAME}.apk"
          LATEST_APK="apps/web-v2/android/UnifyVault-latest.apk"
          SHA_PATH="apps/web-v2/android/SHA256SUMS.txt"
          CHECKSUM=$(cat "$SHA_PATH" | awk '{print $1}')

          echo "Publishing release assets for canonical tag: $RELEASE_TAG"

          cat << 'NOTES' > /tmp/release_notes.md
          ### UnifyVault Android Production Release

          Official production build generated and signed via GitHub Actions CI/CD.

          ### Package & Integrity
          - **Application ID:** `xyz.unifyvault.app`
          - **Canonical Build Artifact:** `UnifyVault-v${V_NAME}.apk`
          - **Latest Build Fallback:** `UnifyVault-latest.apk`
          NOTES

          echo "- **Version Name:** \`$V_NAME\`" >> /tmp/release_notes.md
          echo "- **Version Code:** \`$V_CODE\`" >> /tmp/release_notes.md
          echo "- **SHA-256 Checksum:** \`$CHECKSUM\`" >> /tmp/release_notes.md

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading/clobbering release assets..."
            gh release upload "$RELEASE_TAG" "$CANONICAL_APK" "$LATEST_APK" "$SHA_PATH" --repo "${{ github.repository }}" --clobber
          else
            echo "Creating new canonical release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$CANONICAL_APK" "$LATEST_APK" "$SHA_PATH" \
              --repo "${{ github.repository }}" \
              --title "UnifyVault Android v${V_NAME}" \
              --notes-file /tmp/release_notes.md
          fi
          echo "✓ Release published successfully."

      - name: Update & Commit In-App Version Descriptor
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        env:
          V_NAME: ${{ steps.versioning.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANONICAL_TAG="v${V_NAME}"
          APK_CHECKSUM=$(cat apps/web-v2/android/SHA256SUMS.txt | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${CANONICAL_TAG}/UnifyVault-${CANONICAL_TAG}.apk"

          echo "Updating version descriptor on canonical branch 'main' for release: $CANONICAL_TAG"

          WORKDIR=$(mktemp -d)
          git clone --depth 1 --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$WORKDIR"

          node -e "
            const fs = require('fs');
            const path = '$WORKDIR/apps/web-v2/public/version.json';
            let current = {};
            try { current = JSON.parse(fs.readFileSync(path, 'utf8')); } catch (e) {}
            const updated = {
              latestVersion: '$V_NAME',
              minimumVersion: current.minimumVersion || '1.0.0',
              mandatory: Boolean(current.mandatory),
              downloadUrl: '$DOWNLOAD_URL',
              sha256: '$APK_CHECKSUM',
              releaseNotes: [
                'Production Release v$V_NAME',
                'Performance improvements & security updates',
                'Verified APK SHA-256: $APK_CHECKSUM'
              ]
            };
            fs.writeFileSync(path, JSON.stringify(updated, null, 2) + '\n');
          "

          echo "Descriptor updated: version=$V_NAME, tag=$CANONICAL_TAG, sha256=$APK_CHECKSUM"

          cd "$WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/web-v2/public/version.json
          if git diff --staged --quiet; then
            echo "version.json is already up to date on main. No commit needed."
          else
            git commit -m "chore(release): update in-app version descriptor to v${V_NAME}"
            echo "Pushing updated version.json to canonical main branch..."
            git push origin main
          fi
          rm -rf "$WORKDIR"

      - name: Dispatch Firebase Cloud Messaging Topic Notification
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true') && env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          V_NAME: ${{ steps.versioning.outputs.version_name }}
        run: |
          node -e '
            const https = require("https");
            const crypto = require("crypto");

            function request(options, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = "";
                  res.on("data", (chunk) => data += chunk);
                  res.on("end", () => resolve({ statusCode: res.statusCode, data }));
                });
                req.on("error", reject);
                if (body) req.write(body);
                req.end();
              });
            }

            async function run() {
              let sa;
              try {
                sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
              } catch (e) {
                console.error("Invalid FIREBASE_SERVICE_ACCOUNT_JSON format");
                process.exit(1);
              }

              if (!sa.client_email || !sa.private_key || !sa.project_id) {
                console.error("FIREBASE_SERVICE_ACCOUNT_JSON missing required fields (client_email, private_key, project_id)");
                process.exit(1);
              }

              const header = Buffer.from(JSON.stringify({ alg: "RS256", typ: "JWT" })).toString("base64url");
              const now = Math.floor(Date.now() / 1000);
              const claim = Buffer.from(JSON.stringify({
                iss: sa.client_email,
                scope: "https://www.googleapis.com/auth/firebase.messaging",
                aud: "https://oauth2.googleapis.com/token",
                exp: now + 3600,
                iat: now
              })).toString("base64url");

              const sign = crypto.createSign("RSA-SHA256");
              sign.update(header + "." + claim);
              const sig = sign.sign(sa.private_key, "base64url");
              const jwt = header + "." + claim + "." + sig;

              const postData = "grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=" + jwt;
              const tokenRes = await request({
                hostname: "oauth2.googleapis.com",
                path: "/token",
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" }
              }, postData);

              if (tokenRes.statusCode < 200 || tokenRes.statusCode >= 300) {
                console.error("Google OAuth2 token generation failed with status:", tokenRes.statusCode);
                process.exit(1);
              }

              const tokenData = JSON.parse(tokenRes.data);
              if (!tokenData.access_token) {
                console.error("No access_token found in OAuth2 response");
                process.exit(1);
              }

              const fcmPayload = JSON.stringify({
                message: {
                  topic: "unifyvault-updates",
                  notification: {
                    title: "New UnifyVault Update Available",
                    body: "Version v" + process.env.V_NAME + " is now available."
                  },
                  data: {
                    version: process.env.V_NAME,
                    click_action: "OPEN_UPDATE_MODAL"
                  }
                }
              });

              const fcmRes = await request({
                hostname: "fcm.googleapis.com",
                path: "/v1/projects/" + sa.project_id + "/messages:send",
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + tokenData.access_token,
                  "Content-Type": "application/json"
                }
              }, fcmPayload);

              if (fcmRes.statusCode < 200 || fcmRes.statusCode >= 300) {
                console.error("FCM topic dispatch failed with status:", fcmRes.statusCode);
                process.exit(1);
              }

              console.log("✓ FCM topic notification dispatched successfully for unifyvault-updates. Status:", fcmRes.statusCode);
            }

            run().catch((err) => {
              console.error("FCM dispatch execution error:", err.message);
              process.exit(1);
            });
          '
