[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
via_ir = true
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./script/mainnet/config/" }
]

# Compiler Settings
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
memory_limit = 2147483648 # 2 GB limit per compiler instance
threads = 2 # Limit concurrency so CPU and RAM are not overwhelmed


# Testing configurations
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 15

[profile.ci]
via_ir = true
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 30 }

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
