packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  bufferutil: set this to true or false
  esbuild: set this to true or false
  keccak: set this to true or false
  prisma: set this to true or false
  tesseract.js: set this to true or false
  utf-8-validate: set this to true or false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bufferutil'
  - 'esbuild'
  - 'keccak'
  - 'prisma'
  - 'tesseract.js'
  - 'utf-8-validate'

overrides:
  axios: '>=1.18.0'
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  cross-spawn: '>=7.0.6'
  micromatch: '>=4.0.8'
  body-parser: '>=1.20.6'
  path-to-regexp: '>=0.1.12'
  lodash: '>=4.18.0'
  qr: '0.5.5'
  ws: '^8.21.1'
  js-yaml: '>=4.3.2'
  hono: '^4.12.34'
  nanoid: '^3.3.18'
  postcss: '^8.5.23'
  sharp: '>=0.35.4'
